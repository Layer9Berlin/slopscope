[package]
name = "slopscope"
version = "0.1.0"
edition = "2021"
description = "Detects slop in AI/vibe-coded codebases via process archaeology — git history + filesystem hygiene."
license = "MIT"

[[bin]]
name = "slopscope"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Tree-sitter is used by the three structural code-smell signals
# (swallowed_errors, dead_gates, stub_returns). Other signals stay on regex.
# Each grammar adds ~500 KB to the binary and is built from C at compile time.
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
# `toml` lets the HTTP-client inconsistency signal read Cargo.toml /
# pyproject.toml direct deps.
toml = "0.8"
rmcp = { version = "1.7.0", features = ["server", "transport-io", "macros"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-std", "sync"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true

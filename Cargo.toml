[package]
name = "slopscope"
version = "0.1.0"
edition = "2021"
description = "Detects slop in AI/vibe-coded codebases via process archaeology — git history + filesystem hygiene."
license = "MIT"

[[bin]]
name = "slopscope"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
